# The one workflow for pull requests and pushes to main.
#
#   check ───────────────┐
#   a11y ────────────────┼──► result ("CI gate")
#   renovate-validate ───┤
#   terraform-validate ──┘
#
# `result`, named `CI gate`, is the ONE status check the `main` ruleset requires
# (docs/rulesets/README.md). Its name is the ruleset's contract: renaming it blocks
# every PR. It `needs:` every job and runs `if: always()`, so a cancelled run fails
# the gate instead of skipping it (GitHub counts a skipped required check as passing).
# No other workflow may trigger on `pull_request` or `push`: deploy.yml runs on
# pushes to main only, behind the `production` environment's approval.
#
# Pull requests never receive Cloudflare credentials. Terraform is validated here
# with the backend disabled; the plan against the live zone only runs in deploy.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: engines.node floor matches .nvmrc
        # The floor is a promise that the project works on that Node, and CI and the deploy only
        # run the .nvmrc version, so the two must name the same major or the promise goes
        # untested. Renovate cannot keep them in step (rangeStrategy cannot be limited to
        # majors), so this fails a Node-major PR until engines.node is raised in the same PR.
        run: |
          node -e '
          const fs = require("fs");
          const want = fs.readFileSync(".nvmrc", "utf8").trim().replace(/^v/, "").split(".")[0];
          const range = (JSON.parse(fs.readFileSync("package.json", "utf8")).engines ?? {}).node ?? "";
          const floor = (range.match(/^>=\s*v?(\d+)/) ?? [])[1];
          if (floor !== want) {
            console.error(`engines.node is "${range}" but .nvmrc is ${want}: CI and the deploy build on Node ${want}, so set engines.node to ">=${want}" (package.json, then npm install --package-lock-only).`);
            process.exit(1);
          }
          console.log(`engines.node ${range} matches .nvmrc ${want}`);
          '
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run data:check
      - run: npm run build
      - run: npm run size
      - run: npm run ceilings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  a11y:
    # axe (WCAG 2.x A + AA) on every screen in light and dark through the window.__game hook
    # of an E2E build, then a save-and-reload smoke test on the same build (a game saved through
    # idb-keyval resumes unchanged after a reload), then Lighthouse CI on the production build
    # with score floors (lighthouserc.cjs). Both run on Playwright's Chromium; the Lighthouse report is an
    # artifact, never uploaded anywhere public.
    name: Accessibility (axe + Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: axe on every screen (E2E build)
        run: |
          VITE_E2E=1 npm run build
          npm run a11y
      - name: Save and reload (same E2E build)
        run: npm run save:smoke
      - name: Lighthouse on the production build
        run: |
          npm run build
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npm run lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7

  renovate-validate:
    # A malformed renovate.json fails silently on Renovate's side: dependency
    # automation just stops. Not cached: `npx --package renovate` resolves the
    # newest release each run, and Renovate ships several a day.
    name: renovate.json config validator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npx --yes --package renovate -- renovate-config-validator --strict renovate.json
      - name: Group names must make safe branch names
        # Cloudflare Workers Builds names a preview after the branch and rejects
        # anything outside letters, digits and - _ / . + = (a "Wrangler (deploy)"
        # group made "renovate/wrangler-(deploy)", which failed in 0 s on
        # 2026-11-13). Renovate builds the branch from `groupSlug`, or from
        # `groupName` when there is none, and keeps parentheses. Fail here, not
        # on a Renovate PR a week later.
        run: |
          node -e '
          const fs = require("fs");
          const cfg = JSON.parse(fs.readFileSync("renovate.json", "utf8"));
          let bad = 0;
          for (const r of cfg.packageRules ?? []) {
            if (r.groupName === undefined && r.groupSlug === undefined) continue;
            const slug = r.groupSlug;
            const fine = slug !== undefined ? /^[A-Za-z0-9._+=-]+$/.test(slug) : /^[A-Za-z0-9 ._+=-]*$/.test(r.groupName);
            if (!fine) { console.error(`groupName "${r.groupName}" needs a groupSlug of letters, digits and . _ + = - only`); bad = 1; }
          }
          process.exit(bad);
          '

  terraform-validate:
    # fmt + validate with the backend disabled, so it needs no credentials and no
    # R2 state. Until 2026-11-08 Terraform was only validated inside deploy.yml,
    # i.e. after merge and after approval.
    name: Terraform fmt + validate (cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TF_DIR: infrastructure/terraform/cloudflare
      TF_IN_AUTOMATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform version
      - run: terraform -chdir=$TF_DIR fmt -check -diff
      - run: terraform -chdir=$TF_DIR init -backend=false -input=false
      - run: terraform -chdir=$TF_DIR validate -no-color

  result:
    # The required status check. See the header comment.
    name: CI gate
    needs: [check, a11y, renovate-validate, terraform-validate]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' \
            | tee "$RUNNER_TEMP/results.tsv"
          # Every job is unconditional today, so only `success` passes. `skipped` is
          # accepted so that a job gated on a path filter later counts as "not
          # selected" rather than as a failure, as in knuckles.
          bad=$(awk -F'\t' '$2 != "success" && $2 != "skipped"' "$RUNNER_TEMP/results.tsv")
          if [ -n "$bad" ]; then
            echo "::error::Failed, cancelled, or never decided:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "Every job passed."
