# Cloudflare: Terraform apply, then a Workers static-assets deploy. Runs only on pushes to
# main, inside the `production` GitHub Environment (restrict it to the main branch in
# Settings → Environments; optionally add yourself as a required reviewer so every deploy
# needs a click). Pull requests never receive Cloudflare credentials: ci.yml checks them and
# uploads the built site as an artifact. Skipped, with the missing pieces named in the job
# summary, until the repository variable CLOUDFLARE_ACCOUNT_ID and the environment secrets
# CLOUDFLARE_API_TOKEN, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY exist
# (see infrastructure/terraform/cloudflare/README.md). Third-party actions are pinned to
# commit SHAs; Renovate keeps the pins current.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TF_DIR: infrastructure/terraform/cloudflare

jobs:
  # Secrets cannot be read in a job-level `if`, so a tiny job checks that the account
  # variable and all three secrets exist and names whatever is missing in the summary.
  preflight:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          HAS_R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY != '' }}
        run: |
          missing=()
          [ -n "$ACCOUNT_ID" ]        || missing+=("repository variable CLOUDFLARE_ACCOUNT_ID")
          [ "$HAS_CF_TOKEN" = true ]  || missing+=("production secret CLOUDFLARE_API_TOKEN")
          [ "$HAS_R2_KEY" = true ]    || missing+=("production secret R2_ACCESS_KEY_ID")
          [ "$HAS_R2_SECRET" = true ] || missing+=("production secret R2_SECRET_ACCESS_KEY")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo '### Cloudflare deploy: configuration complete' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            { echo '### Cloudflare deploy skipped: missing configuration'; printf -- '- %s\n' "${missing[@]}"; echo; echo 'See infrastructure/terraform/cloudflare/README.md.'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  terraform:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_IN_AUTOMATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform -chdir=$TF_DIR fmt -check -diff
      - run: >-
          terraform -chdir=$TF_DIR init -input=false
          -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"
      - run: terraform -chdir=$TF_DIR validate -no-color
      - name: Plan
        run: terraform -chdir=$TF_DIR plan -input=false -no-color -out=tfplan | tee plan.txt
      - name: Plan summary
        run: |
          { echo '### Terraform plan'; echo '```'; grep -E '^(Plan:|No changes)' plan.txt || tail -n 5 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply
        run: terraform -chdir=$TF_DIR apply -input=false -no-color tfplan

  deploy:
    needs: [preflight, terraform]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://capivararica.com.br
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The same gates as ci.yml, so a deploy can never ship what the tests reject.
      - run: npm run check
      - run: npm test
      - run: npm run data:check
      - run: npm run build
        env:
          BASE_PATH: /
      - run: npm run size
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
