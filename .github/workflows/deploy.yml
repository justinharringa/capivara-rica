# Cloudflare: Terraform apply, then a Workers static-assets deploy, on pushes to main only.
# One job, in the `production` GitHub Environment (Settings → Environments → production:
# deployment branches = main, no required reviewer, so a push deploys without an approval). Pull requests never receive Cloudflare credentials: ci.yml checks
# them and uploads the built site as an artifact. The job stops with a clear message if the
# repository variable CLOUDFLARE_ACCOUNT_ID or any of the environment secrets
# CLOUDFLARE_API_TOKEN, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY is missing
# (see infrastructure/terraform/cloudflare/README.md). Third-party actions are pinned to
# commit SHAs; Renovate keeps the pins current.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TF_DIR: infrastructure/terraform/cloudflare

defaults:
  run:
    # Explicit bash gives `set -eo pipefail`, so `terraform plan | tee` cannot mask a failure.
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://capivararica.com.br
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_IN_AUTOMATION: '1'
    steps:
      - name: Check configuration
        run: |
          missing=()
          [ -n "$TF_VAR_account_id" ]     || missing+=("repository variable CLOUDFLARE_ACCOUNT_ID")
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing+=("production secret CLOUDFLARE_API_TOKEN")
          [ -n "$AWS_ACCESS_KEY_ID" ]     || missing+=("production secret R2_ACCESS_KEY_ID")
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || missing+=("production secret R2_SECRET_ACCESS_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            { echo '### Cloudflare deploy stopped: missing configuration'; printf -- '- %s\n' "${missing[@]}"; echo; echo 'See infrastructure/terraform/cloudflare/README.md.'; } >> "$GITHUB_STEP_SUMMARY"
            printf 'Missing: %s\n' "${missing[@]}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- Terraform: zone settings and the typo-domain redirect ---------------------------
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform -chdir=$TF_DIR fmt -check -diff
      - run: >-
          terraform -chdir=$TF_DIR init -input=false
          -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"
      - run: terraform -chdir=$TF_DIR validate -no-color
      - name: Terraform plan
        run: terraform -chdir=$TF_DIR plan -input=false -no-color -out=tfplan | tee plan.txt
      - name: Terraform plan summary
        run: |
          { echo '### Terraform plan'; echo '```'; grep -E '^(Plan:|No changes)' plan.txt || tail -n 5 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Terraform apply
        run: terraform -chdir=$TF_DIR apply -input=false -no-color tfplan

      # --- Build with the same gates as ci.yml, then deploy the Worker --------------------
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run data:check
      - run: npm run build
        env:
          BASE_PATH: /
      - run: npm run size
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
