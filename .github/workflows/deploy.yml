# Cloudflare: Terraform (plan on PRs, apply on main) then a Workers static-assets deploy.
# Skipped (with the missing pieces named in the job summary) until the repository
# variable CLOUDFLARE_ACCOUNT_ID and the secrets CLOUDFLARE_API_TOKEN, R2_ACCESS_KEY_ID and
# R2_SECRET_ACCESS_KEY all exist (see infrastructure/terraform/cloudflare/README.md).
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_DIR: infrastructure/terraform/cloudflare

jobs:
  # Secrets cannot be read in a job-level `if`, so a tiny job checks that the account
  # variable and all three secrets exist and names whatever is missing in the summary.
  # The deploy jobs run only when everything is present.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          HAS_R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY != '' }}
        run: |
          missing=()
          [ -n "$ACCOUNT_ID" ]        || missing+=("repository variable CLOUDFLARE_ACCOUNT_ID")
          [ "$HAS_CF_TOKEN" = true ]  || missing+=("secret CLOUDFLARE_API_TOKEN")
          [ "$HAS_R2_KEY" = true ]    || missing+=("secret R2_ACCESS_KEY_ID")
          [ "$HAS_R2_SECRET" = true ] || missing+=("secret R2_SECRET_ACCESS_KEY")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo '### Cloudflare deploy: configuration complete' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            { echo '### Cloudflare deploy skipped: missing configuration'; printf -- '- %s\n' "${missing[@]}"; echo; echo 'See infrastructure/terraform/cloudflare/README.md.'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  terraform:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_IN_AUTOMATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform -chdir=$TF_DIR fmt -check -diff
      - run: >-
          terraform -chdir=$TF_DIR init -input=false
          -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"
      - run: terraform -chdir=$TF_DIR validate -no-color
      - name: Plan
        run: terraform -chdir=$TF_DIR plan -input=false -no-color -out=tfplan | tee plan.txt
      - name: Plan summary
        run: |
          { echo '### Terraform plan'; echo '```'; grep -E '^(Plan:|No changes)' plan.txt || tail -n 5 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform -chdir=$TF_DIR apply -input=false -no-color tfplan

  deploy:
    needs: [preflight, terraform]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The same gates as ci.yml, so a deploy can never ship what the tests reject.
      - run: npm run check
      - run: npm test
      - run: npm run data:check
      - run: npm run build
        env:
          BASE_PATH: /
      - run: npm run size
      - name: Deploy to Cloudflare Workers (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Upload a preview version (pull request)
        if: github.event_name == 'pull_request'
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.number }}
      - name: Preview URL
        if: github.event_name == 'pull_request'
        run: |
          { echo '### Preview'; echo '```'; grep -iE 'workers\.dev' <<< "${{ steps.preview.outputs.command-output }}" || echo 'see job log'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
