# Cloudflare: Terraform (plan on PRs, apply on main) then a Pages deploy.
# Skipped entirely until the repository variable CLOUDFLARE_ACCOUNT_ID is set, so the
# repo stays green before the account is wired up. Secrets: CLOUDFLARE_API_TOKEN,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (see infrastructure/terraform/cloudflare/README.md).
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_DIR: infrastructure/terraform/cloudflare

jobs:
  terraform:
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_IN_AUTOMATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform -chdir=$TF_DIR fmt -check -diff
      - run: >-
          terraform -chdir=$TF_DIR init -input=false
          -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"
      - run: terraform -chdir=$TF_DIR validate -no-color
      - name: Plan
        run: terraform -chdir=$TF_DIR plan -input=false -no-color -out=tfplan | tee plan.txt
      - name: Plan summary
        run: |
          { echo '### Terraform plan'; echo '```'; grep -E '^(Plan:|No changes)' plan.txt || tail -n 5 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform -chdir=$TF_DIR apply -input=false -no-color tfplan

  pages:
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The same gates as ci.yml, so a deploy can never ship what the tests reject.
      - run: npm run check
      - run: npm test
      - run: npm run data:check
      - run: npm run build
        env:
          BASE_PATH: /
      - run: npm run size
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist --project-name=capivara-rica
            --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
            --commit-dirty=true
      - name: Deployment URL
        run: |
          { echo '### Cloudflare Pages'; echo "${{ steps.deploy.outputs.deployment-url }}"; } >> "$GITHUB_STEP_SUMMARY"
